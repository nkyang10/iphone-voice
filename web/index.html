<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dictation Bridge</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    font: 17px/1.45 -apple-system, system-ui, sans-serif;
    background: #0d0f12; color: #e8eaed;
    min-height: 100vh; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #5f6368; flex: 0 0 auto; }
  .dot.ok { background: #34a853; }
  .dot.warn { background: #f9ab00; }
  .dot.bad { background: #ea4335; }
  .label { font-size: 14px; color: #9aa0a6; }
  select {
    font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
    background: #202124; color: #e8eaed; border: 1px solid #3c4043; flex: 1;
  }
  .val { font-size: 15px; font-variant-numeric: tabular-nums; color: #e8eaed; }
button {
    touch-action: manipulation;
    font: inherit; padding: 15px; border-radius: 12px; border: 1px solid #3c4043;
    background: #202124; color: #e8eaed; width: 100%;
  }
  button:disabled { opacity: .45; }
  #start { background: #1a73e8; border-color: #1a73e8; font-weight: 600; }
  /* The Start button reports what the recogniser is actually doing, so it needs
     three looks and not one. Blue and dimmed with a breathing ring means the
     microphone is open and words will be typed. Amber and fully lit means iOS has
     stopped listening and this is the thing to tap. */
  #start.live:disabled { opacity: 1; animation: halo 2s ease-out infinite; }
  #start.starting:disabled { opacity: .85; }
  #start.resume { background: #e8710a; border-color: #e8710a; color: #241300; }
  @keyframes halo {
    from { box-shadow: 0 0 0 0 rgba(26, 115, 232, .55); }
    to { box-shadow: 0 0 0 16px rgba(26, 115, 232, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #start.live:disabled { animation: none; box-shadow: 0 0 0 2px rgba(26, 115, 232, .55); }
  }
  #stop { background: #202124; }
  .card {
    background: #16181c; border: 1px solid #2a2d31; border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: #80868b; margin: 0; font-weight: 600; }
  #final {
    font-size: 19px; min-height: 30px; word-break: break-word;
    color: #8ab4f8; white-space: pre-wrap;
  }
  #interim { font-size: 15px; min-height: 22px; color: #9aa0a6; word-break: break-word; }
  #stats { font-size: 13px; color: #80868b; line-height: 1.6; }
  #stats b { color: #bdc1c6; font-weight: 500; }
  .warnbox {
    display: none; background: #3c2f12; border: 1px solid #7a5c17;
    color: #fdd663; border-radius: 10px; padding: 11px 13px; font-size: 14px;
  }
  .warnbox.show { display: block; }
  .pendingbox {
    display: none; background: #17303f; border: 1px solid #1f5b7a;
    color: #8ab4f8; border-radius: 10px; padding: 11px 13px; font-size: 14px;
  }
  #transcript {
    max-height: 30vh; overflow-y: auto; font-size: 15px; line-height: 1.5;
    -webkit-overflow-scrolling: touch;
  }
  .tline { padding: 3px 0; border-bottom: 1px solid #23262b; word-break: break-word; }
  .tline:last-child { border-bottom: 0; }
  .pending-line { color: #fdd663; }
  input[type=checkbox] { width: 20px; height: 20px; }
  button { margin-top: 2px; }
  .diagout {
    display: none; max-height: 34vh; overflow: auto; margin: 8px 0 0;
    font: 11px/1.45 ui-monospace, Menlo, monospace; color: #9aa0a6;
    white-space: pre-wrap; word-break: break-all; background: #12141700;
  }
  .diagout.show { display: block; }
  .ttime { color: #80868b; font-size: 12px; font-variant-numeric: tabular-nums;
    margin-right: 8px; }
  hr { border: 0; border-top: 1px solid #2a2d31; margin: 0; }
  a { color: #8ab4f8; }
</style>
</head>
<body>

<h1>Dictation Bridge</h1>

<div class="row">
  <span class="dot" id="wsDot"></span>
  <span class="label" id="wsLabel">connecting to desktop</span>
</div>
<div class="row">
  <span class="dot" id="recDot"></span>
  <span class="label" id="recLabel">idle</span>
</div>

  <div class="row">
  <span class="label">Language</span>
  <select id="lang"></select>
</div>

<div class="warnbox" id="warn"></div>
  <div class="pendingbox" id="pending">
    <span id="pendingText"></span>
  </div>

<button id="start">Start listening</button>
<button id="stop" disabled>Stop</button>

<div class="card">
  <h2>Heard</h2>
  <div id="final"></div>
  <div id="interim"></div>
</div>

<div class="card">
  <h2>Transcript on this phone</h2>
  <div id="transcript"></div>
</div>

<hr>

<div class="card">
  <h2>Desktop</h2>
  <div class="row"><span class="label">Typing</span><span class="val" id="typingState">checking</span></div>
</div>

<div class="card">
  <h2>Page</h2>
  <div id="stats"></div>
</div>

<div class="card">
  <h2>Diagnostics</h2>
  <div class="row">
    <input type="checkbox" id="logWords">
    <span class="label">include spoken words in the report (off = privacy)</span>
  </div>
  <div class="row">
    <button id="diagSend">Send to desktop</button>
  </div>
  <div class="row">
    <button id="diagCopy">Copy report</button>
  </div>
  <div class="row">
    <button id="diagToggle">Show log</button>
  </div>
  <pre id="diagOut" class="diagout"></pre>
</div>

<script>
(function () {
  'use strict';

  var STALL_MS = 12000;
  var RESTART_MS = 250;
  // How long the recognizer's volatile tail stays on screen after it stops growing.
  var SETTLE_MS = 1400;
  var POLL_MS = 1500;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  var el = {
    wsDot: document.getElementById('wsDot'),
    wsLabel: document.getElementById('wsLabel'),
    recDot: document.getElementById('recDot'),
    recLabel: document.getElementById('recLabel'),
    warn: document.getElementById('warn'),
    start: document.getElementById('start'),
    stop: document.getElementById('stop'),
    final: document.getElementById('final'),
    interim: document.getElementById('interim'),
    transcript: document.getElementById('transcript'),
    logWords: document.getElementById('logWords'),
    diagSend: document.getElementById('diagSend'),
    diagCopy: document.getElementById('diagCopy'),
    diagToggle: document.getElementById('diagToggle'),
    diagOut: document.getElementById('diagOut'),
    pending: document.getElementById('pending'),
    pendingText: document.getElementById('pendingText'),
    typingState: document.getElementById('typingState'),
    stats: document.getElementById('stats')
  };

  var stats = { sessions: 0, stalls: 0, sent: 0, heard: 0, errors: 0, langTries: 0, deaf: 0, streamed: 0, rewrites: 0 };
  var token = null, wantRun = false;
  var history = [];
  var rec = null, lastEvent = 0, watchdog = null, restartTimer = null;

  // Whether the current recognizer has ever confirmed with onstart. Silence after
  // that is an idle recognizer with nobody talking, which is the normal state;
  // silence before it means start() was accepted and then wedged. Those need very
  // different handling, so they are told apart here rather than guessed at.
  var recStartedOk = false;
  // Set when iOS ends the session itself, and when it reports an error that means
  // the recognizer is no longer dependable. Both leave the microphone shut, and
  // both are the only honest cue that it is time to hand control back to the user.
  var recEnded = false, recFault = '';
  var sessionStartedAt = 0, runHeard = 0;
  var settleTimer = null;
  var recSeq = 0;

  function warn(msg) {
    el.warn.textContent = msg;
    el.warn.className = msg ? 'warnbox show' : 'warnbox';
  }

  function setRec(state, text) {
    el.recLabel.textContent = text;
    el.recDot.className = 'dot ' + state;
  }

  function langTriesNote() {
    if (langIndex === 0) return '';
    return 'fell back ' + langIndex + ' step' + (langIndex === 1 ? '' : 's');
  }

  // The one place that decides what the Start button looks like and whether it
  // works.
  //
  // It used to be written wherever a recognizer event happened, which is how four
  // places ended up disagreeing about the same button. Every state is derived here
  // from what actually happened to the recognizer instead, so there is nothing to
  // forget to update: no recognizer, no start confirmation, an iOS end, an iOS
  // error, or genuinely live.
  //
  // Disabled while live is the point. iOS requires a real gesture for every
  // start(), so a re-pressable Start doubles as tap-to-resume, but as long as the
  // microphone is open there is nothing for a tap to do -- and a button that can
  // always be pressed cannot tell the user anything. Turning it into the state
  // display means one glance says whether dictation is actually running, which is
  // the question a walkie-talkie button cannot answer on its own.
  function syncStartButton() {
    if (!wantRun) {
      el.start.disabled = false;
      el.start.className = '';
      el.start.textContent = 'Start listening';
      el.stop.disabled = true;
      return;
    }
    el.stop.disabled = false;

    if (rec && !recStartedOk) {
      el.start.disabled = true;
      el.start.className = 'starting';
      el.start.textContent = 'Starting (' + activeLang + ')';
      return;
    }
    if (recEnded) {
      el.start.disabled = false;
      el.start.className = 'resume';
      el.start.textContent = 'Listening stopped - tap to resume';
      return;
    }
    if (recFault) {
      el.start.disabled = false;
      el.start.className = 'resume';
      el.start.textContent = 'Lost the microphone - tap to resume';
      return;
    }
    if (rec) {
      el.start.disabled = true;
      el.start.className = 'live';
      el.start.textContent = 'Listening (' + activeLang + ')';
      return;
    }
    // wantRun is set but there is no recognizer: mid-rearm, or a start that threw.
    el.start.disabled = false;
    el.start.className = 'resume';
    el.start.textContent = 'Not listening - tap to start';
  }

  function renderStats() {
    var secs = sessionStartedAt ? Math.round((Date.now() - sessionStartedAt) / 1000) : 0;
    el.stats.innerHTML =
      'language <b>' + activeLang + '</b>' +
        (langTriesNote() ? ' (' + langTriesNote() + ')' : '') + '<br>' +
      'language fallbacks <b>' + stats.langTries + '</b><br>' +
      'recognizer sessions <b>' + stats.sessions + '</b><br>' +
      'watchdog stalls <b>' + stats.stalls + '</b><br>' +
      'results heard <b>' + stats.heard + '</b><br>' +
      'chunks streamed <b>' + stats.streamed + '</b><br>' +
      'posted to desktop <b>' + stats.sent + '</b><br>' +
      'waiting to send <b>' + outbox.length + '</b><br>' +
      'typed on desktop <b>' + serverTyped + '</b><br>' +
      'recognizer errors <b>' + stats.errors + '</b><br>' +
      'session uptime <b>' + secs + 's</b>';
  }
  setInterval(renderStats, 1000);

  if (!SR) {
    el.start.disabled = true;
    setRec('bad', 'unsupported');
    if (location.protocol === 'http:') {
      warn('SpeechRecognition needs a secure (https) page. This page was opened over plain http, ' +
           'so Safari hides the API. Reopen using the https:// address from the desktop window, ' +
           'and install the certificate first.');
    } else if (!window.isSecureContext) {
      warn('This page is not a secure context, so Safari hides SpeechRecognition. ' +
           'Install the certificate from the desktop, then reopen the page.');
    } else {
      warn('This browser has no SpeechRecognition. It needs Safari on iOS 14.5 or newer. ' +
           'Chrome or Firefox on iOS cannot help: they do not expose the API.');
    }
  }

  // ---- transport ------------------------------------------------------------
  // Plain HTTP, same origin as the page. No handshake to get wrong, and the
  // desktop learns the phone is alive from the status poll.

  function post(path, payload) {
    return fetch(path, {
      method: payload ? 'POST' : 'GET',
      headers: payload ? { 'Content-Type': 'application/json' } : undefined,
      body: payload ? JSON.stringify(payload) : undefined,
      cache: 'no-store'
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }

  // ---- streaming outbox ----------------------------------------------------
  // Text goes out while it is still being spoken, not once the sentence is over.
  //
  // It used to wait for isFinal, which meant a sentence only appeared on the
  // desktop after the speaker had finished saying it -- for a dictation tool the
  // lag is the whole complaint. And because Safari sometimes never sets isFinal at
  // all, that wait had no floor: interimResults is the safety net for exactly that
  // case, but the interim path only ever recorded text locally, so an utterance
  // could sit on the phone indefinitely and never reach the desktop at all.
  //
  // A LAN POST of a few dozen characters costs about as much as the packet header,
  // so there is nothing to gain by batching and a lot to lose by delaying. The
  // desktop types what arrives straight into the focused window, and KEYEVENTF_UNICODE
  // cannot select or delete, so whatever is sent is typed for good.
  //
  // One queue, drained head first, one request in flight at a time. Order is the
  // whole point: an earlier chunk that failed has to land before a later one, or
  // the sentence arrives scrambled. The old code pushed failures onto a side list
  // and let the next chunk post immediately, which could reorder them.

  var MAX_QUEUE = 60;
  var outbox = [];
  var flushing = false;

  function enqueue(text) {
    if (!text) return;
    // A phone left talking with the desktop asleep would otherwise queue every
    // chunk until the tab died. Folding into the tail keeps both the text and its
    // order while capping the backlog; what is already queued is never dropped.
    if (outbox.length >= MAX_QUEUE) {
      outbox[outbox.length - 1] += text;
    } else {
      outbox.push(text);
    }
    typedTail = text.charAt(text.length - 1);
    updatePending();
    flushOutbox();
  }

  function flushOutbox() {
    if (flushing || outbox.length === 0) return;
    flushing = true;
    var chunk = outbox[0];
    post('/speak', { token: token, text: chunk })
      .then(function () {
        outbox.shift();
        flushing = false;
        stats.sent++;
        stats.heard++;
        pushLocal(chunk);
        updatePending();
        flushOutbox();
      })
      .catch(function () {
        // Leave it at the head. The next status poll retries from here, so nothing
        // that was said is dropped because the Wi-Fi blinked.
        flushing = false;
      });
  }

  // Polls the desktop and drains anything queued while it was unreachable.
  function pollStatus() {
    return post('/status').then(function (s) {
      el.wsDot.className = 'dot ok';
      el.wsLabel.textContent = 'connected to desktop';
      // There is no armed flag to read any more: the desktop types whatever
      // arrives, and this page's Start button is the only on/off switch.
      el.typingState.textContent = 'straight into the focused window';
      serverTyped = s.typed;
      flushOutbox();
    }).catch(function () {
      el.wsDot.className = 'dot bad';
      el.wsLabel.textContent = 'desktop not reachable';
      el.typingState.textContent = 'unknown';
    });
  }

  var serverTyped = 0;

  // ---- turning results into text to send ------------------------------------

  // The slice of the recognizer's running text already sent. Interim results are
  // cumulative: each one is the whole utterance so far, so the new text is simply
  // what has appeared since the last look. Anchoring on content rather than on
  // result index means a result turning final needs no special handling at all,
  // which matters because on iOS it may never turn final.
  var streamAnchor = '';
  // Last character actually sent, so a separator can be inserted between chunks
  // when the recognizer did not supply one.
  var typedTail = '';
  var sentText = '';
  var _rewriteNotedFor = 0;

  function isWide(c) {
    // CJK, kana and fullwidth forms. Spelled as escapes on purpose: a literal range
    // here is unreadable and silently breaks if the file's encoding is ever mangled.
    // Cantonese is written without spaces, so a space injected between chunks would
    // be worse than none.
    if (!c) return false;
    var n = c.charCodeAt(0);
    return (n >= 0x2e80 && n <= 0x9fff) ||   // radicals, kana, CJK
           (n >= 0xf900 && n <= 0xfaff) ||   // compatibility ideographs
           (n >= 0xfe30 && n <= 0xfe4f) ||   // CJK compatibility forms
           (n >= 0xff00 && n <= 0xff60) ||   // fullwidth forms
           (n >= 0x3000 && n <= 0x303f);     // CJK punctuation
  }

  function isWideEdge(a, b) {
    return !/\s$/.test(a) && !/^\s/.test(b) && !isWide(a.charAt(a.length - 1)) && !isWide(b.charAt(0));
  }

  function withSeparator(s) {
    if (!s || !typedTail) return s;
    if (isWideEdge(typedTail, s)) return ' ' + s;
    return s;
  }

  // One string for the whole result list, with a separator added only where the
  // recognizer produced a new result and left no space of its own. Deterministic,
  // so the same event always rebuilds the same string and the anchor stays valid.
  function buildFull(results) {
    var out = '';
    for (var i = 0; i < results.length; i++) {
      var t = '';
      try { t = results[i][0].transcript || ''; } catch (e) { t = ''; }
      if (!t) continue;
      if (out && isWideEdge(out, t)) out += ' ';
      out += t;
    }
    return out;
  }

  // A new recognizer starts a fresh result list, so there is nothing left to
  // continue: the anchor resets rather than treating the first words of the new
  // session as a rewrite of the old ones.
  function streamReset() {
    streamAnchor = '';
  }

  function streamFull(full) {
    if (!full) return;
    // True only for the first text of a recognizer, i.e. the one case where
    // buildFull had no left context to work with.
    var firstOfEpoch = (streamAnchor === '');
    var delta = '';
    if (full.length > streamAnchor.length &&
        full.slice(0, streamAnchor.length) === streamAnchor) {
      delta = full.slice(streamAnchor.length);
    } else if (full !== streamAnchor) {
      // Safari changed words that have already been typed. There is no way to take
      // them back -- the desktop can only append -- so re-anchor on what the
      // recognizer settled on and keep streaming from there. The misheard word
      // stays wrong; the rest of the sentence still arrives, in order.
      stats.rewrites++;
      if (_rewriteNotedFor !== recSeq) {
        _rewriteNotedFor = recSeq;
        note('rewrite', 'recognizer changed text already sent; re-anchoring on ' + full.length + ' chars');
      }
    }
    streamAnchor = full;

    // The separator is a boundary repair, not a habit. Applying it to every chunk
    // split words in half: a recognizer growing "hel" into "hello" hands over the
    // delta "lo wor", which continues the same word and must not be spaced away
    // from it. Inside one recognizer, buildFull has already put a space wherever a
    // new result needed one. The only gap left is the very start of a session,
    // where the new recognizer's result list has nothing before it and its first
    // word would butt straight against the last word of the previous one.
    var out = firstOfEpoch ? withSeparator(delta) : delta;
    if (!out) return;
    stats.streamed++;
    sentText += out;
    if (sentText.length > 400) sentText = sentText.slice(sentText.length - 400);
    el.final.textContent = sentText;
    enqueue(out);
  }

  // Safari sometimes never marks a result final, so the recognizer's volatile tail
  // is shown live while it grows and cleared once it settles. What has been typed
  // is accumulated above it and is never rewritten.
  function showTail(results) {
    var tail = '';
    for (var i = results.length - 1; i >= 0; i--) {
      if (!results[i].isFinal) {
        try { tail = results[i][0].transcript || ''; } catch (e) { tail = ''; }
        break;
      }
    }
    tail = tail.replace(/^\s+/, '');
    el.interim.textContent = tail;
    clearTimeout(settleTimer);
    settleTimer = null;
    if (tail) settleTimer = setTimeout(settleTail, SETTLE_MS);
  }

  function settleTail() {
    settleTimer = null;
    el.interim.textContent = '';
  }

  // Polls the desktop and drains anything queued while it was unreachable.
  function pollStatus() {
    return post('/status').then(function (s) {
      el.wsDot.className = 'dot ok';
      el.wsLabel.textContent = 'connected to desktop';
      // There is no armed flag to read any more: the desktop types whatever
      // arrives, and this page's Start button is the only on/off switch.
      el.typingState.textContent = 'straight into the focused window';
      serverTyped = s.typed;
      flushOutbox();
    }).catch(function () {
      el.wsDot.className = 'dot bad';
      el.wsLabel.textContent = 'desktop not reachable';
      el.typingState.textContent = 'unknown';
    });
  }

  var serverTyped = 0;

  // ---- local transcript ------------------------------------------------------
  // One line per chunk, recorded when the desktop has confirmed it, so this list is
  // a mirror of what was actually typed rather than of what was recognised. A
  // mismatch between this and the desktop is the thing worth reporting.

  function pushLocal(text) {
    history.push({ t: text, time: new Date() });
    if (history.length > 200) history.shift();
    renderHistory();
  }

  function renderHistory() {
    var rows = history.slice(-40).reverse();
    el.transcript.textContent = '';
    for (var i = 0; i < rows.length; i++) {
      var line = document.createElement('div');
      line.className = 'tline';
      var stamp = document.createElement('span');
      stamp.className = 'ttime';
      stamp.textContent = rows[i].time.toTimeString().slice(0, 8);
      var body = document.createElement('span');
      body.textContent = rows[i].t;
      line.appendChild(stamp);
      line.appendChild(body);
      el.transcript.appendChild(line);
    }
  }

  function updatePending() {
    if (outbox.length === 0) {
      el.pending.style.display = 'none';
    } else {
      el.pending.style.display = 'block';
      el.pendingText.textContent =
        outbox.length + ' chunk' + (outbox.length === 1 ? '' : 's') +
        ' of speech waiting to send. Will retry automatically.';
    }
  }



  function startPolling() {
    pollStatus();
    setInterval(pollStatus, POLL_MS);
    checkVersion();
    setInterval(checkVersion, 60000);
  }

  // iOS Safari keeps a cached copy even with no-store, so a phone left open
  // across a desktop rebuild would keep running the old script. Ask the
  // desktop what it is serving and reload when it differs.
  function checkVersion() {
    return fetch('/config', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg.version) return;
        var known = null;
        try { known = localStorage.getItem('page-version'); } catch (e) {}
        if (known === null) {
          try { localStorage.setItem('page-version', cfg.version); } catch (e) {}
          return;
        }
        if (known !== cfg.version) {
          note('ui', 'desktop rebuilt the page, reloading');
          try { localStorage.setItem('page-version', cfg.version); } catch (e) {}
          location.reload(true);
        }
      })
      .catch(function () {});
  }

  // ---- recognizer -----------------------------------------------------------

  var LANGS = [
    { code: 'zh-HK', label: 'Cantonese / Chinese Hong Kong (zh-HK)', fall: ['yue-HK', 'zh-TW', 'en-US'] },
    { code: 'yue-HK', label: 'Cantonese (yue-HK)', fall: ['zh-HK', 'zh-TW', 'en-US'] },
    { code: 'zh-TW', label: 'Chinese - Taiwan (zh-TW)', fall: ['zh-HK', 'yue-HK', 'en-US'] },
    { code: 'zh-CN', label: 'Chinese - Mandarin (zh-CN)', fall: ['en-US'] },
    { code: 'en-US', label: 'English (US)', fall: ['en-GB'] },
    { code: 'en-GB', label: 'English (UK)', fall: ['en-US'] },
    { code: 'ja-JP', label: 'Japanese (ja-JP)', fall: ['en-US'] },
    { code: 'ko-KR', label: 'Korean (ko-KR)', fall: ['en-US'] }
  ];

  // Safari is picky about Cantonese: yue-HK is the correct BCP-47 tag, but some
  // iOS versions only accept zh-HK. If a language is rejected we walk this list
  // rather than retrying the same code forever with no output.
  var langChain = [];
  var langIndex = 0;
  var activeLang = 'zh-HK';
  var wantedLang = 'zh-HK';

  function beginLangChain() {
    var chosen = chosenLang();
    activeLang = chosen;
    wantedLang = chosen;
    langChain = [chosen];
    for (var i = 0; i < LANGS.length; i++) {
      if (LANGS[i].code === chosen && LANGS[i].fall) {
        langChain = langChain.concat(LANGS[i].fall);
        break;
      }
    }
    langIndex = 0;
  }

  function nextLang() {
    langIndex++;
    if (langIndex >= langChain.length) return null;
    var rejected = activeLang;
    activeLang = langChain[langIndex];
    stats.langTries++;
    setRec('warn', 'trying ' + activeLang);
    warn('iOS does not accept ' + rejected + ' for recognition. Trying ' + activeLang + '.');
    rearm("lang-rejected")
    return activeLang;
  }

  // ---- diagnostics ---------------------------------------------------------
  // Records every recognizer lifecycle event with a timestamp, so a failure that
  // only shows up on the phone can be diagnosed after the fact instead of
  // guessed at. The transcript text is deliberately NOT included by default;
  // it goes to the desktop log only if you turn "log words" on below.
  var diag = [];
  var DIAG_MAX = 400;
  var diagT0 = Date.now();
  var logWords = false;

  function stamp() {
    return ((Date.now() - diagT0) / 1000).toFixed(1);
  }

  function note(kind, detail) {
    diag.push({ t: stamp(), kind: kind, d: detail === undefined ? '' : String(detail) });
    if (diag.length > DIAG_MAX) diag.shift();
  }

  // Feature and environment facts that explain most failures on their own.
  function noteEnvironment() {
    note('env', 'ua=' + navigator.userAgent);
    note('env', 'secure=' + window.isSecureContext + ' proto=' + location.protocol);
    note('env', 'SR=' + (window.SpeechRecognition ? 'unprefixed' :
                         window.webkitSpeechRecognition ? 'webkit' : 'ABSENT'));
    note('env', 'audioWorklet=' + (!!(window.AudioContext || window.webkitAudioContext)));
    note('env', 'wakeLock=' + ('wakeLock' in navigator));
    note('env', 'speechSynthesis=' + (typeof window.speechSynthesis !== 'undefined'));
    note('env', 'mediaDevices=' + !!navigator.mediaDevices);
    note('env', 'visibility=' + document.visibilityState);
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      try {
        navigator.mediaDevices.enumerateDevices().then(function (list) {
          note('env', 'devices=' + list.length);
        }).catch(function (e) { note('env', 'enumerateDevices failed: ' + e.name); });
      } catch (e) { note('env', 'enumerateDevices threw: ' + e.message); }
    }
    if (window.SpeechRecognition && window.SpeechRecognition.available) {
      try {
        var p = window.SpeechRecognition.available({ langs: [chosenLang()], processLocally: false });
        if (p && p.then) p.then(function (s) { note('env', 'available()=' + s); })
          .catch(function (e) { note('env', 'available() threw ' + e.name); });
      } catch (e) { note('env', 'available() sync throw: ' + e.message); }
    }
  }

  // True when the call to start() happened inside a real user tap. iOS may
  // require a gesture for every start, not just the first.
  function inGesture() {
    try {
      return navigator.userActivation ? navigator.userActivation.isActive : null;
    } catch (e) { return null; }
  }

  function diagReport() {
    return {
      token: token,
      ua: navigator.userAgent,
      secure: !!window.isSecureContext,
      proto: location.protocol,
      hasSR: !!SR,
      lang: activeLang,
      wanted: wantedLang,
      chain: langChain.join('>'),
      langTries: stats.langTries,
      sessions: stats.sessions,
      stalls: stats.stalls,
      heard: stats.heard,
      deaf: stats.deaf,
      sent: stats.sent,
      streamed: stats.streamed,
      rewrites: stats.rewrites,
      errors: stats.errors,
      pending: outbox.length,
      wantRun: wantRun,
      recStarted: recStartedOk,
      recEnded: recEnded,
      recFault: recFault || '',
      sinceStart: sessionStartedAt ? Math.round((Date.now() - sessionStartedAt) / 1000) : 0,
      attempts: pastAttempts(),
      events: diag
    };
  }

  // The events list and the counters live in memory, so a reload erases both --
  // and a reload is exactly what happens when the page version changes or Safari
  // reuses a tab. That is how a failed Start ends up with no evidence at all: the
  // report arrives describing a page that has never been pressed. Persist the last
  // few attempts so the next report carries them across the reload.
  var ATTEMPT_KEY = 'db-start-attempts';

  function pastAttempts() {
    try { return JSON.parse(localStorage.getItem(ATTEMPT_KEY) || '[]'); }
    catch (e) { return []; }
  }

  function recordAttempt(entry) {
    try {
      var list = pastAttempts();
      list.push(entry);
      while (list.length > 8) list.shift();
      localStorage.setItem(ATTEMPT_KEY, JSON.stringify(list));
    } catch (e) { }
  }

  function clockNow() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
      ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' +
      ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
  }

  function chosenLang() {
    var sel = document.getElementById('lang');
    return sel && sel.value ? sel.value : 'zh-HK';
  }

  function newRecognizer() {
    var id = ++recSeq;
    var gesture = inGesture();
    note('new', '#' + id + ' lang=' + activeLang + ' gesture=' + gesture);
    recStartedOk = false;
    recEnded = false;
    recFault = '';

    var r = new SR();
    r.lang = activeLang;
    r.continuous = true;
    // Safari sometimes never sets isFinal. If we only trusted final results we
    // would get no output at all; the interim results are the safety net, and the
    // text is sent as it arrives rather than held until a verdict that may never
    // come.
    r.interimResults = true;
    r.maxAlternatives = 1;

    // A retired recognizer has been replaced; its events must not touch state.
    r.retired = false;

    r.onstart = function () {
      if (r.retired) return;
      note('start', '#' + id);
      recStartedOk = true;
      recFault = '';
      lastEvent = Date.now();
      setRec('ok', 'listening');
      syncStartButton();
    };

    r.onresult = function (ev) {
      if (r.retired) return;
      lastEvent = Date.now();
      var full = buildFull(ev.results);
      var tail = '';
      for (var t = ev.results.length - 1; t >= 0; t--) {
        if (!ev.results[t].isFinal) {
          try { tail = ev.results[t][0].transcript || ''; } catch (e) { tail = ''; }
          break;
        }
      }
      note('result', '#' + id + ' results=' + ev.results.length +
        ' from=' + ev.resultIndex + ' chars=' + full.length +
        ' sent=' + streamAnchor.length + ' runHeard=' + runHeard +
        (stats.rewrites ? ' rewrites=' + stats.rewrites : '') +
        (logWords && full ? ' words=[' + full + ']' : ''));

      showTail(ev.results);
      if (!full) return;
      runHeard++;
      streamFull(full);
    };

    r.onerror = function (ev) {
      if (r.retired) return;
      note('error', '#' + id + ' ' + (ev && ev.error ? ev.error : '?') +
        (ev && ev.message ? ' ' + ev.message : ''));
      lastEvent = Date.now();
      stats.errors++;
      var code = ev && ev.error ? ev.error : 'unknown';

      // Safari ends a session with no-speech after a pause. That is normal for
      // an idle recognizer, not a fault worth showing.
      if (code === 'no-speech') {
        setRec('ok', 'listening');
        return;
      }

      if (code === 'language-not-supported') {
        // Do not loop on a language the device will never accept.
        if (nextLang() === null) {
          wantRun = false;
          retireCurrent();
          setRec('bad', 'no usable language');
          warn('iOS rejected ' + wantedLang + ' and every fallback (' +
               langChain.join(', ') + '). Pick a different language above and tap Start again.');
        }
        return;
      }
      if (code === 'not-allowed' || code === 'service-not-allowed') {
        wantRun = false;
        retireCurrent();
        setRec('bad', 'mic blocked');
        warn('Microphone access is blocked for this site. Allow the microphone in ' +
             'Settings, then tap Start again.');
        return;
      }

      // Everything below leaves a recognizer that cannot be trusted to still be
      // hearing anything: iOS has said the session is in trouble, and it will not
      // necessarily send onend afterwards to say so cleanly. Hand the button back
      // so the user can see dictation needs attention rather than sitting there
      // claiming to listen.
      recFault = code;
      syncStartButton();
      if (code === 'network') {
        setRec('warn', 'network retrying');
        return;
      }
      setRec('warn', 'recovering (' + code + ')');
    };

    r.onend = function () {
      if (r.retired) { note('end', '#' + id + ' (retired)'); return; }
      note('end', '#' + id);
      lastEvent = Date.now();
      // iOS shut the microphone itself. That is the one moment the user actually
      // needs to know, and it arrives before the automatic re-arm does.
      recEnded = true;
      syncStartButton();
      setRec('', 'iOS stopped listening');
      if (wantRun) scheduleRestart();
    };

    return r;
  }

  // Safari ends the session after a stretch of silence. That is normal for an
  // idle recognizer, so simply re-arm; rearm() retires the old instance so the
  // abort's own onend cannot schedule yet another restart.
  function scheduleRestart() {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(function () {
      if (!wantRun) return;
    rearm("session-ended")
    }, RESTART_MS);
  }

  // A hang produces no event at all, so silence has to be treated as failure.
  // Always abort and build a fresh instance; the same instance may be wedged.
  //
  // But silence on its own is not a hang, and treating it as one is worse than the
  // fault it was meant to catch. A recognizer that has confirmed with onstart and
  // is now quiet is an idle recognizer with nobody talking: the normal state, and
  // on iOS 18 it stays that way indefinitely, never sending no-speech and never
  // ending. Re-arming on a timer therefore rebuilt the recognizer every 14 seconds
  // for as long as the page was open -- a real phone report showed sessions 64 and
  // stalls 63 over fifteen minutes, while dictation itself worked perfectly.
  //
  // So only a recognizer that never confirmed counts as wedged: start() was
  // accepted and iOS then said nothing at all.
  watchdog = setInterval(function () {
    if (!wantRun || !rec) return;
    if (recStartedOk) return;
    if (Date.now() - lastEvent < STALL_MS) return;
    stats.stalls++;
    setRec('warn', 'recovering from stall');
    rearm("watchdog-stall")
  }, 2000);

  // Silence after a successful start, which is a different failure and was not
  // detected at all.
  //
  // lastEvent is refreshed by onstart as well as by results and errors, so while
  // the user keeps tapping Start the stall watchdog can never fire: every tap
  // resets the clock. That is exactly what a report from a real phone showed --
  // ten sessions, every onstart delivered, errors 0, stalls 0, and not one
  // syllable heard. The recognizer was alive and deaf.
  //
  // iOS reports nothing for this. There is no no-speech event, no error, and no
  // end: the session just sits there. So measure the silence against the last
  // thing actually recognised and, if there is one, walk the language chain --
  // an accepted-but-silent language is the likeliest cause, and the chain already
  // knows how to move on.
  var DEAF_MS = 7000;
  var _deafNotedFor = 0;

  setInterval(function () {
    if (!wantRun || !rec) return;
    // Only a recognizer that actually started can be "started but deaf". One that
    // never delivered onstart is wedged, which belongs to the watchdog above --
    // letting this timer near it walked the language chain for a fault that has
    // nothing to do with language, which is how a stuck recognizer ended up
    // reporting langTries instead of stalls.
    if (!recStartedOk) return;
    // Heard something in this run: silence is normal then, because nobody is
    // talking. Compared against the per-run counter, not the page-lifetime one --
    // once a single word had ever been heard, the page-wide count stayed above
    // zero for the rest of the session and this timer never fired again, so a
    // second Start on the same page load could come up deaf and stay that way.
    if (runHeard > 0) return;
    var quiet = Date.now() - lastEvent;
    if (quiet < DEAF_MS) return;

    if (_deafNotedFor !== recSeq) {
      _deafNotedFor = recSeq;
      note('deaf', 'started but nothing heard in ' + Math.round(quiet / 1000) +
           's on ' + activeLang + '; walking the language chain');
    }
    stats.deaf++;
    setRec('warn', 'hearing nothing, trying the next language');
    if (nextLang() === null) {
      // Every language in the chain started and heard nothing. Say so plainly
      // instead of restarting the same dead language forever.
      wantRun = false;
      retireCurrent();
      setRec('bad', 'nothing heard in any language');
      warn('iOS started dictation but nothing was heard in any language (' +
           langChain.join(', ') + '). This is usually a microphone or permission ' +
           'problem rather than the page. Check Settings > Safari > Microphone, ' +
           'then pick another language above and tap Start again.');
      note('deaf', 'every language heard nothing; giving up until the next tap');
    }
  }, 2000);

  // Abort and immediately re-arm: used when the language changes, when the
  // watchdog sees a hang, and when Safari ends the session after silence.
  //
  // The old recognizer is retired before abort() so its onend is ignored.
  // Without that, abort() fires onend, which called scheduleRestart, which
  // aborted again: every cycle created two recognizers until start() began
  // throwing and recognition stopped permanently after any idle period.
  // Detach the current recognizer and stop it for good. The retire flag is what
// stops the instance's own onend from scheduling yet another restart; it must be
// set before abort(), never after.
function retireCurrent() {
    var old = rec;
    rec = null;
    if (old) old.retired = true;
    try { if (old) old.abort(); } catch (e) { note('abortThrew', e.message); }
    // A new recognizer begins a fresh result list, so the streaming anchor has to
    // start over. Without this, the first words of the new session read as a
    // rewrite of the last ones and nothing would be sent until it happened to line
    // up again.
    streamReset();
    syncStartButton();
  }

  function rearm(reason) {
    clearTimeout(restartTimer);
    note('rearm', reason || 'unspecified' + ' gesture=' + inGesture());
    retireCurrent();

    rec = newRecognizer();
    stats.sessions++;
    syncStartButton();
    try {
      rec.start();
      note('startCalled', 'ok gesture=' + inGesture());
      lastEvent = Date.now();
    } catch (e) {
      note('startThrew', e.name + ': ' + e.message);
      setRec('warn', 'restart failed, retrying');
      syncStartButton();
      scheduleRestart();
    }
  }

  // Start doubles as the recognizer's state display and as the only thing on the
  // page that can supply a real gesture to start(), so it lights up again the moment
  // iOS stops the microphone. See syncStartButton().
  function start(how) {
    var at = clockNow();

    // No recognizer support: bail out loud. This used to return silently, so the
    // only sign was a button that did nothing at all.
    if (!SR) {
      setRec('bad', 'unsupported');
      note('ui', 'start refused: this browser has no SpeechRecognition');
      recordAttempt({ at: at, via: how || '?', outcome: 'no SpeechRecognition in this browser' });
      return;
    }

    warn('');
    note('ui', 'start tapped via ' + (how || '?') + ', gesture=' + inGesture());
    recordAttempt({ at: at, via: how || '?', outcome: 'starting', gesture: inGesture() });
    wantRun = true;
    sessionStartedAt = Date.now();
    // Per run, not per page load: the deaf timer below compares against it, and a
    // counter left over from an earlier run would switch that check off for good
    // after the first word ever spoken.
    runHeard = 0;

    // Any recognizer still around is retired first, and it does not matter which
    // kind it is: either the live one from the run being resumed, or a leftover
    // from a run that gave up. The language chain running out sets wantRun false
    // but leaves rec set, because Safari has already ended that instance itself.
    // Overwriting rec instead is how two recognizers end up alive at once, and
    // they pile up until start() throws and dictation stops for good.
    //
    // beginLangChain() runs every time on purpose. Tapping Start means "start
    // again with the language I picked", which is also what recovers from an
    // exhausted chain, and re-resolving it keeps that behaviour predictable
    // instead of depending on how the previous run happened to end.
    retireCurrent();
    beginLangChain();

    rec = newRecognizer();
    stats.sessions++;
    setRec('warn', 'starting (' + activeLang + ')');
    syncStartButton();
    try {
      rec.start();
      lastEvent = Date.now();
      recordAttempt({ at: at, via: how || '?',
                      outcome: 'start() returned ok, waiting for onstart' });
    } catch (e) {
      // Silent failure used to be the norm here: iOS can refuse start() without
      // throwing and without ever sending onstart, so the page just sat there.
      // Say it, and leave a trace in the status line the user can read.
      setRec('bad', 'start failed');
      syncStartButton();
      warn('The browser refused to start dictation: ' + e.message +
           ' — tap Start again, and if it keeps failing send a diagnostics report.');
      recordAttempt({ at: at, via: how || '?', outcome: 'start() threw: ' + e.name + ': ' + e.message });
      throw e;
    }
  }

  function stop() {
    wantRun = false;
    clearTimeout(restartTimer);
    clearTimeout(settleTimer);
    settleTimer = null;
    var old = rec;
    rec = null;
    if (old) old.retired = true;
    try { if (old) old.abort(); } catch (e) {}
    streamReset();
    el.interim.textContent = '';
    setRec('', 'stopped');
    syncStartButton();
  }

  // Fired from pointerdown, not from click.
  //
  // iOS Safari does not always synthesise click for a tap: a touch that Safari
  // also reads as a small scroll produces pointerdown and touchend but no click,
  // and the button then does nothing at all with no error anywhere. That is one
  // candidate for "I tapped Start and it failed immediately" with an empty
  // report. Acting on pointerdown removes that whole class of failure, and it
  // also hands SpeechRecognition.start() the freshest possible gesture, which
  // matters because iOS can require a live one.
  //
  // click is still handled, for keyboard activation and for desktop mice, and
  // suppressed when it is only the tail of a pointerdown we already acted on.
  // The window has to be tight: pointerdown and click for one tap land within
  // milliseconds of each other, and a wide window here silently swallows a
  // deliberate Stop-then-Start a moment later. stop() and start() also clear
  // each other's timestamp, so the pair is never mistaken for one tap.
  var _startTapAt = 0;
  var _stopTapAt = 0;

  function startTapped(ev) {
    var type = ev ? ev.type : 'none';
    if (type === 'click') {
      if (Date.now() - _startTapAt < 250) return;
      _startTapAt = Date.now();
      start('click');
      return;
    }
    // Let the mouse keep its click: a drag that starts on the button should not
    // start dictating.
    if (ev && ev.pointerType === 'mouse') return;
    _startTapAt = Date.now();
    _stopTapAt = 0;
    start('pointerdown');
  }

  function stopTapped(ev) {
    var type = ev ? ev.type : 'none';
    if (type === 'click') {
      if (Date.now() - _stopTapAt < 250) return;
      _stopTapAt = Date.now();
      stop();
      return;
    }
    if (ev && ev.pointerType === 'mouse') return;
    _stopTapAt = Date.now();
    _startTapAt = 0;
    stop();
  }

  el.start.addEventListener('pointerdown', startTapped);
  el.start.addEventListener('click', startTapped);
  el.stop.addEventListener('pointerdown', stopTapped);
  el.stop.addEventListener('click', stopTapped);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wantRun && (!rec || Date.now() - lastEvent > STALL_MS)) {
      try { if (rec) rec.abort(); } catch (e) {}
      rec = newRecognizer();
      stats.sessions++;
      streamReset();
      syncStartButton();
      try { rec.start(); } catch (e) { scheduleRestart(); }
    }
  });

  window.addEventListener('pagehide', function () {
    wantRun = false;
    clearTimeout(settleTimer);
    settleTimer = null;
    // Best effort only: a fetch started here usually does not finish, and there is
    // no navigator.sendBeacon for a request that carries the token in a body.
    flushOutbox();
    try { if (rec) rec.abort(); } catch (e) {}
  });

  // Exposed for diagnostics and for the browser-side test harness. Harmless:
  // nothing here reaches the desktop except through the same token-checked
  // endpoints the page already uses.
  window.dictationBridge = {
    versionCheck: checkVersion,
    stats: function () { return stats; },
    transcript: function () { return history.slice(); },
    queued: function () { return outbox.slice(); },
    button: function () {
      return { disabled: el.start.disabled, label: el.start.textContent, cls: el.start.className };
    }
  };

  // ---- diagnostics UI -------------------------------------------------------

  function renderDiag() {
    var rows = [];
    for (var i = 0; i < diag.length; i++) {
      rows.push(diag[i].t + 's  ' + diag[i].kind + '  ' + diag[i].d);
    }
    el.diagOut.textContent = rows.join('\n');
    el.diagOut.scrollTop = el.diagOut.scrollHeight;
  }

  function reportText() {
    var r = diagReport();
    return JSON.stringify(r, null, 1);
  }

  el.logWords.addEventListener('change', function () {
    logWords = el.logWords.checked;
    note('ui', 'logWords=' + logWords);
  });

  el.diagToggle.addEventListener('click', function () {
    if (el.diagOut.className.indexOf('show') >= 0) {
      el.diagOut.className = 'diagout';
      el.diagToggle.textContent = 'Show log';
    } else {
      renderDiag();
      el.diagOut.className = 'diagout show';
      el.diagToggle.textContent = 'Hide log';
    }
  });

  el.diagCopy.addEventListener('click', function () {
    var text = reportText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        el.diagCopy.textContent = 'Copied';
      }).catch(function () { showDiag(text); });
    } else {
      showDiag(text);
    }
  });

  function showDiag(text) {
    renderDiag();
    el.diagOut.className = 'diagout show';
    el.diagToggle.textContent = 'Hide log';
    el.diagOut.textContent = text;
  }

  el.diagSend.addEventListener('click', function () {
    note('ui', 'manual report send');
    post('/diag', diagReport()).then(function () {
      el.diagSend.textContent = 'Sent - see desktop log';
    }).catch(function (e) {
      el.diagSend.textContent = 'Send failed: ' + e.message;
    });
  });

  // Idle, the recognizer gets no events at all. A periodic beacon makes that
  // visible in the report instead of looking like a dead page.
  setInterval(function () {
    if (wantRun) note('beat', 'sessions=' + stats.sessions + ' heard=' + stats.heard +
      ' chunks=' + stats.streamed + ' rewrites=' + stats.rewrites +
      ' queued=' + outbox.length + ' btn=' + (recStartedOk && !recEnded && !recFault ? 'live' : 'tap') +
      ' sinceLast=' + Math.round((Date.now() - lastEvent) / 1000) + 's');
  }, 15000);

  // ---- boot -----------------------------------------------------------------

  (function fillLangs() {
    var sel = document.getElementById('lang');
    if (!sel) return;
    for (var i = 0; i < LANGS.length; i++) {
      var opt = document.createElement('option');
      opt.value = LANGS[i].code;
      opt.textContent = LANGS[i].label;
      sel.appendChild(opt);
    }
    var saved = null;
    try { saved = localStorage.getItem('dictation-lang'); } catch (e) {}
    // zh-HK first: it is the tag Apple's own dictation uses for Cantonese, and
    // yue-HK is only tried if the device rejects it.
    sel.value = saved || 'zh-HK';
    activeLang = sel.value;
    sel.addEventListener('change', function () {
      try { localStorage.setItem('dictation-lang', sel.value); } catch (e) {}
      if (wantRun) {
        beginLangChain();
    rearm("lang-change")
      }
    });
  })();

  post('/config')
    .then(function (cfg) {
      token = cfg.token;
      try {
        if (cfg.version) localStorage.setItem('page-version', cfg.version);
      } catch (e) {}
      note('ui', 'config loaded, page ' + (cfg.version || '?'));
      noteEnvironment();
      el.wsLabel.textContent = 'loading';
      startPolling();
    })
    .catch(function () {
      note('ui', 'config load failed');
      warn('Could not reach the desktop. Open this page using the https address from the desktop window.');
      el.wsDot.className = 'dot bad';
      el.wsLabel.textContent = 'desktop not reachable';
    });

  // Ship diagnostics automatically when recognition fails, so a bug that only
  // reproduces on the phone still leaves a trace in the desktop log.
  var lastReport = 0;
  setInterval(function () {
    if (!wantRun) return;
    if (stats.errors === 0 || runHeard > 0) return;
    if (Date.now() - lastReport < 45000) return;
    lastReport = Date.now();
    note('auto', 'reporting: errors with nothing heard');
    post('/diag', diagReport()).catch(function () { });
  }, 20000);
})();
</script>
</body>
</html>
